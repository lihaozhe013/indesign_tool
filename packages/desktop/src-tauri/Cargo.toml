[package]
name = "structured-publisher-desktop"
version = "0.1.0"
description = "Desktop publishing workflow for Adobe InDesign"
authors = ["Structured Publisher"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "structured_publisher_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
rfd = "0.17.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
uuid = { version = "1", features = ["v4"] }
